<div class="lang-switch" role="group" aria-label="Language / 语言">
  <button type="button" data-set-lang="en">EN</button>
  <button type="button" data-set-lang="zh">中文</button>
</div>
<script>
  document.querySelectorAll('[data-set-lang]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var lang = btn.dataset.setLang, root = document.documentElement;
      root.dataset.lang = lang;
      root.lang = lang === 'zh' ? 'zh-CN' : 'en';
      document.title = window.PAGE_TITLES[lang];
      try { localStorage.setItem('lang', lang); } catch (e) {}
      var url = new URL(location.href);
      if (url.searchParams.has('lang')) { url.searchParams.set('lang', lang); history.replaceState(null, '', url); }
    });
  });
</script>
